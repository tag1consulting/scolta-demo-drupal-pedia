name: the-athenaeum
type: drupal
docroot: web
php_version: "8.4"
webserver_type: nginx-fpm
router_http_port: "80"
router_https_port: "443"
mariadb_version: "10.11"
database:
  type: mariadb
  version: "10.11"

hooks:
  post-start:
    - exec-host: |
        RELEASE_JSON=$(curl -s "https://api.github.com/repos/tag1consulting/scolta-demo-drupal-pedia/releases/latest")
        if [ ! -f db/dump.sql.gz ]; then
          echo ""
          echo "┌─────────────────────────────────────────────────────┐"
          echo "│  Downloading database dump (~490 MB) — please wait  │"
          echo "│  This is a one-time download and may take minutes.  │"
          echo "└─────────────────────────────────────────────────────┘"
          mkdir -p db
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | grep -o "https://[^\"]*dump\.sql\.gz[^\"]*" | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Could not find dump.sql.gz in the latest GitHub release."
            echo "Download manually: https://github.com/tag1consulting/scolta-demo-drupal-pedia/releases/latest"
            exit 1
          fi
          curl -L --progress-bar -o db/dump.sql.gz "$DOWNLOAD_URL"
          echo "Database dump downloaded."
        fi
        if [ ! -d web/sites/default/files/article-images ] || [ -z "$(ls -A web/sites/default/files/article-images 2>/dev/null)" ]; then
          echo ""
          echo "┌──────────────────────────────────────────────────────────┐"
          echo "│  Downloading article images (~1.6 GB) — please wait      │"
          echo "│  This is a one-time download and may take several minutes │"
          echo "└──────────────────────────────────────────────────────────┘"
          mkdir -p web/sites/default/files
          IMAGES_URL=$(echo "$RELEASE_JSON" | grep -o "https://[^\"]*article-images\.tar\.gz[^\"]*" | head -1)
          if [ -z "$IMAGES_URL" ]; then
            echo "ERROR: Could not find article-images.tar.gz in the latest GitHub release."
            echo "Download manually: https://github.com/tag1consulting/scolta-demo-drupal-pedia/releases/latest"
            exit 1
          fi
          curl -L --progress-bar -o /tmp/article-images.tar.gz "$IMAGES_URL"
          tar -xzf /tmp/article-images.tar.gz -C web/sites/default/files/
          rm /tmp/article-images.tar.gz
          echo "Article images downloaded and extracted."
        fi
    - exec: composer install --no-interaction
    - exec-host: |
        if [ -f db/dump.sql.gz ] && [ ! -f db/.imported ]; then
          echo "Importing database (this takes a few minutes)..."
          ddev import-db --file=db/dump.sql.gz
          echo "Rebuilding caches and building Scolta search index..."
          mkdir -p web/sites/default/private
          ddev drush cache:rebuild
          ddev drush php:script /var/www/html/scripts/setup-about-page.php

          # Build Scolta search index with automatic resume on memory pressure.
          # The indexer commits chunks to disk before yielding, so each pass
          # picks up where the last one left off. With the default 512 MB ddev
          # memory limit, expect ~20 passes for the full 6900+ entity corpus.
          MAX_PASSES=40
          PASS=0
          BUILD_COMPLETE=false

          while [ "$BUILD_COMPLETE" = "false" ] && [ "$PASS" -lt "$MAX_PASSES" ]; do
            PASS=$((PASS + 1))

            if [ "$PASS" -eq 1 ]; then
              echo "Scolta build pass $PASS/$MAX_PASSES..."
              ddev drush scolta:build 2>&1 || true
            else
              echo "Scolta resume pass $PASS/$MAX_PASSES..."
              ddev drush scolta:build --resume 2>&1 || true
            fi

            STATUS=$(ddev drush scolta:status 2>&1)
            INDEXED=$(echo "$STATUS" | grep -o 'Indexed: [0-9]*' | grep -o '[0-9]*')
            TOTAL=$(echo "$STATUS" | grep -o 'Indexed: [0-9]*/[0-9]*' | grep -o '/[0-9]*' | tr -d '/')

            if [ -n "$INDEXED" ] && [ -n "$TOTAL" ] && [ "$INDEXED" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              BUILD_COMPLETE=true
              echo "Scolta indexing complete: $INDEXED/$TOTAL entities indexed."
            else
              echo "Scolta progress: ${INDEXED:-0}/${TOTAL:-?} entities indexed."
            fi
          done

          if [ "$BUILD_COMPLETE" = "false" ]; then
            echo ""
            echo "WARNING: Scolta indexing did not complete after $MAX_PASSES passes."
            echo "Run 'ddev drush scolta:build --resume' to continue indexing."
            echo "Use 'ddev drush scolta:status' to check progress."
            echo ""
          fi

          touch db/.imported
          echo "Setup complete."
        fi
    - exec-host: |
        # Rebuild pagefind index if missing (gitignored, so absent on fresh clone).
        # The PHP indexer yields on memory pressure and spawns background resumes,
        # so we loop until pagefind-entry.json appears on disk.
        if ! ddev exec test -f web/sites/default/files/scolta-pagefind/pagefind/pagefind-entry.json 2>/dev/null; then
          echo "Pagefind index missing — rebuilding..."
          MAX_PASSES=40
          PASS=0

          while ! ddev exec test -f web/sites/default/files/scolta-pagefind/pagefind/pagefind-entry.json 2>/dev/null && [ "$PASS" -lt "$MAX_PASSES" ]; do
            PASS=$((PASS + 1))

            if [ "$PASS" -eq 1 ]; then
              echo "Scolta build pass $PASS/$MAX_PASSES..."
              ddev drush scolta:build 2>&1 || true
            else
              echo "Scolta resume pass $PASS/$MAX_PASSES..."
              ddev drush scolta:build --resume 2>&1 || true
            fi

            # The build spawns background resumes on memory pressure.
            # Wait up to 90s for a resume to finish before starting the next pass.
            for i in $(seq 1 18); do
              if ddev exec test -f web/sites/default/files/scolta-pagefind/pagefind/pagefind-entry.json 2>/dev/null; then
                break
              fi
              sleep 5
            done
          done

          if ddev exec test -f web/sites/default/files/scolta-pagefind/pagefind/pagefind-entry.json 2>/dev/null; then
            FRAGMENTS=$(ddev drush scolta:status 2>&1 | grep -o 'Fragments: *[0-9]*' | grep -o '[0-9]*')
            echo "Scolta indexing complete: ${FRAGMENTS:-?} pagefind fragments."
          else
            echo "WARNING: Scolta indexing did not complete after $MAX_PASSES passes."
            echo "Run 'ddev drush scolta:build --resume' to continue."
          fi
        fi

additional_fqdns: []
