global:
  version: 1.x
  css:
    theme:
      css/athenaeum.css: {}
  js:
    js/athenaeum.js: {}
  dependencies:
    - core/drupal
    - core/jquery
    - core/once

# Rich Scolta result cards plus the themed search-as-you-type dropdown.
# Attached alongside the Scolta search block by athenaeum_scolta_block_view_alter().
#
# Deliberately NOT header JS. scolta.js defines window.Scolta when it executes
# and Drupal's scolta bridge behavior calls Scolta.init() on DOMContentLoaded;
# a header script would run before the first and blow up. The scolta/search
# dependency orders this file after the bundle, and the footer places it before
# behaviors run — the window the renderer has to register in.
scolta-rich-results:
  version: 1.x
  css:
    theme:
      css/scolta-rich-results.css: {}
  js:
    js/scolta-rich-results.js: {}
  dependencies:
    - scolta/search

leaflet:
  version: 1.x
  js:
    https://unpkg.com/leaflet@1.9.4/dist/leaflet.js: { type: external, minified: true }
  css:
    theme:
      https://unpkg.com/leaflet@1.9.4/dist/leaflet.css: { type: external }
